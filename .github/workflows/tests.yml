name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: modelagree run examples/demo.yaml
      - run: modelagree report runs/demo
  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build --tag modelagree:ci .
      - name: Run offline demo and verify reports
        run: |
          output_dir="$(mktemp -d)"
          docker run --rm --network none \
            --mount "type=bind,source=$output_dir,target=/app/runs" \
            modelagree:ci
          test -f "$output_dir/demo/report.html"
          test -f "$output_dir/demo/scores.json"
