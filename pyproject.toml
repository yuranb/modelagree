[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelagree"
version = "0.1.0"
description = "Reproducible, auditable agreement evaluation for structured LLM labels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7"]
keywords = ["llm", "annotation", "agreement", "evaluation", "reproducibility"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/yuranb/modelagree"
Issues = "https://github.com/yuranb/modelagree/issues"
Changelog = "https://github.com/yuranb/modelagree/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7,<10", "pytest-socket>=0.7,<1"]
dev = ["ruff"]

[project.scripts]
modelagree = "modelagree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
